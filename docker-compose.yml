version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_stack
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring_net
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_stack
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring_net
    restart: always

networks:
  monitoring_net:
    driver: bridge

volumes:
  grafana_data:
